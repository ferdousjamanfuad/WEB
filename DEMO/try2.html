<!DOCTYPE html>

<html>

<head>

    <style>
        .box {

            width: 100px;

            height: 100px;

            border: 2px solid black;

            overflow: hidden;

        }
    </style>

</head>

<body>

    <div class="box">

        This is a very long paragraph.

        It has many many words.

        The box height is only 100 pixels.

        So the content cannot fit.

    </div>

</body>

</html>
